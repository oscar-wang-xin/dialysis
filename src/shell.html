<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7490">
<meta name="description" content="给透析患者和家属用的护理记录网页：透析中血糖监护、每日记录、就诊摘要、A4 打印。数据只存本机。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2322B8D8'/%3E%3Cstop offset='1' stop-color='%230E7490'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M7 34h10l5-12 9 22 5-10h21' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>透析照护助手</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <button type="button" class="brand" data-act="go" data-view="today"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12h3.6l2.4-6 4.6 12 2.5-6h6"/></svg></span><span class="brand-txt">透析照护助手<small>患者与家属的护理记录页</small></span></button>
      <div class="top-meta"><span class="live-dot"></span>数据只存本机 · 不上传</div>
    </div>
    <nav class="nav" id="nav" aria-label="主导航">
      <button type="button" data-act="go" data-view="today">今天</button>
      <button type="button" data-act="go" data-view="records">记录</button>
      <button type="button" data-act="go" data-view="triage">排查</button>
      <button type="button" data-act="go" data-view="knowledge">知识</button>
      <button type="button" data-act="go" data-view="data">数据与设置</button>
    </nav>
    <p class="boundary">护理记录工具 · 不诊断、不调药、不替代医生 · 急症联系透析中心或 120</p>
  </header>

  <section id="sheet" class="sheet" hidden aria-label="编辑区"></section>
  <main id="view" class="view" role="main" aria-live="off"></main>

  <footer class="footer">
    <div class="footer-in">
      <p><b>透析照护助手</b> · 一个可离线使用的护理记录网页，不是医疗设备。</p>
      <p class="small">记录保存在当前浏览器的本机存储里，换设备、清缓存都会丢，请定期导出 JSON 备份。页面不会主动请求任何外部资源；外链只在你点击时打开。</p>
    </div>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>

<script>window.APP_DATA=/*__DATA__*/;</script>
<script>/*__JS__*/</script>

</html>
